[package]
name = "numu-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "numu-server"
path = "src/main.rs"

[dependencies]
numu-api = { path = "../api" }
numu-app-portfolio = { path = "../apps/portfolio" }
tokio.workspace = true

[features]
# keeps the workspace-wide `cargo test --features db-tests` (ci.sh db gate) resolvable here.
db-tests = ["numu-api/db-tests", "numu-app-portfolio/db-tests"]
