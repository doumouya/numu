[package]
name = "numu-data"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }

# PURE COMPUTE — the server-typing subset of redpash's `data` engine: parse
# (decode + sniff), dtype detection, sentinels, cleanness score. Native-only
# here; the client-compute / wasm surface stays the frontend's job.
[lib]
name = "data"
path = "src/lib.rs"

[dependencies]
shared = { package = "numu-shared", path = "../shared" }
serde = { workspace = true }
thiserror = { workspace = true }
polars = { workspace = true }
chardetng = { workspace = true }
encoding_rs = { workspace = true }
