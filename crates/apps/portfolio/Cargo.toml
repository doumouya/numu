[package]
name = "numu-app-portfolio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
numu-api = { path = "../../api" }
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
# publish-only deps (CASE 0024) — confined to the app crate; core gains nothing.
genpdf = "0.2"
base64 = "0.22"
reqwest.workspace = true
time.workspace = true
sha2.workspace = true

[dev-dependencies]
tokio.workspace = true

[features]
# forwards the workspace-wide `cargo test --features db-tests` (ci.sh db gate) into this crate's
# DB-backed suite AND numu-api's.
db-tests = ["numu-api/db-tests"]
