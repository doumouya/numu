[package]
name = "numu-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "numu-api"
path = "src/main.rs"

[dependencies]
axum.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
thiserror.workspace = true
sha2.workspace = true
hmac.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
arc-swap.workspace = true

[features]
# db-tests: opt-in DB-backed integration tests (need a live Postgres via DATABASE_URL). ci.sh's `db`
# gate runs `cargo test --features db-tests --test db_smoke` only when DATABASE_URL is set; the bare
# `test` gate stays DB-free and green on a fresh clone.
db-tests = []
