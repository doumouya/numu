# numu — workspace.
# crates/api is the HTTP edge. `shared` (DTOs) + `data` (pure-compute CSV typing engine, the server-typing
# subset ported from redpash) land with the frontend data plane (README §3 Bucket 1 / migrations 0016+0017).
[workspace]
resolver = "2"
members = ["crates/api", "crates/shared", "crates/data"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio", "tls-rustls", "postgres", "json", "macros", "migrate",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v7"] }
time = { version = "0.3", features = ["formatting"] }
thiserror = "2"
sha2 = "0.10"
hmac = "0.12"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
arc-swap = "1"
# data plane (CSV typing engine — native server build; stock polars, no wasm fork needed here)
polars = { version = "0.54", features = ["lazy", "csv", "strings", "dtype-full"] }
chardetng = "0.1"
encoding_rs = "0.8"

[profile.release]
opt-level = 2
