# numu — workspace.
# crates/api is the HTTP edge. The `data` crate (pure compute → wasm) and `shared` (DTOs) are added
# when the first compute / cross-crate type lands — the workspace grows; we don't ship empty crates.
[workspace]
resolver = "2"
members = ["crates/api"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio", "tls-rustls", "postgres", "json", "macros", "migrate",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v7"] }
time = { version = "0.3", features = ["formatting"] }
thiserror = "2"

[profile.release]
opt-level = 2
